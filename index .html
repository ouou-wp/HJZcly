<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程表 · 淡蓝物语</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #eaf7ff 50%, #e0efff 100%);
    min-height: 100vh;
    padding: 24px 16px 60px;
    color: #2d4a6b;
  }
  .container { max-width: 1280px; margin: 0 auto; }

  .banner {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .banner-center { text-align: center; padding-bottom: 26px; }
  .banner-center h1 {
    font-size: 34px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #2f7fc4, #55a8e8, #7fc4f5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .banner-center p { margin-top: 8px; color: #7a92ad; font-size: 13px; letter-spacing: 1px; }
  .banner-center .deco { color: #9ecdf2; font-size: 14px; letter-spacing: 6px; margin-top: 4px; }

  .chibi-float {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 10px 26px rgba(90, 169, 230, .4);
    object-fit: cover;
    background: #fff;
    z-index: 60;
    pointer-events: none;
    animation: chibiFloat 3.4s ease-in-out infinite;
  }
  @keyframes chibiFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }

  .countdown-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: linear-gradient(120deg, #4a90d9 0%, #6cb4ee 55%, #8fcbf7 100%);
    border-radius: 18px;
    padding: 18px 26px;
    color: #fff;
    box-shadow: 0 10px 30px rgba(74, 144, 217, .35);
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .cd-title { font-size: 13px; opacity: .88; letter-spacing: 2px; }
  .cd-time { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 2px; margin: 2px 0; }
  .cd-course { font-size: 14px; opacity: .95; }
  .remind-btn {
    border: 2px solid rgba(255,255,255,.75);
    background: rgba(255,255,255,.16);
    color: #fff;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .remind-btn:hover { background: rgba(255,255,255,.3); }
  .remind-btn.on { background: #fff; color: #3d83c6; border-color: #fff; font-weight: 700; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,.92);
    border: 1px solid #dbeaf8;
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 4px 18px rgba(90, 169, 230, .12);
    margin-bottom: 14px;
    position: relative;
    z-index: 30;
  }
  .toolbar label { font-size: 13px; color: #6a87a5; display: flex; align-items: center; gap: 6px; }
  .toolbar input[type="date"] {
    border: 1px solid #cfe2f5;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: #2d4a6b;
    outline: none;
    background: #fff;
  }
  .toolbar input[type="date"]:focus { border-color: #5aa9e6; }
  .search-box { position: relative; flex: 1; min-width: 220px; }
  .search-box input {
    width: 100%;
    border: 1px solid #cfe2f5;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    outline: none;
    background: #f7fbff;
    color: #2d4a6b;
  }
  .search-box input:focus { border-color: #5aa9e6; }
  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #fff;
    border: 1px solid #dbeaf8;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(74, 144, 217, .18);
    display: none;
    max-height: 420px;
    overflow-y: auto;
  }
  .search-results.show { display: block; }

  /* 课程选择器面板 */
  .sel-panel {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 12px;
    background: linear-gradient(90deg, #eaf4ff, #f2f9ff);
    border-bottom: 1px solid #dbeaf8;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .sel-panel label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #4a7fb5; font-weight: 700;
  }
  .sel-panel select {
    border: 1px solid #b9d8f2;
    border-radius: 8px;
    background: #fff;
    color: #2d4a6b;
    font-size: 12px;
    padding: 5px 6px;
    max-width: 240px;
    outline: none;
    cursor: pointer;
  }
  .sel-panel select:focus { border-color: #5aa9e6; }
  .sel-panel .sel-hint { font-size: 11px; color: #8ba3bd; }

  .search-item {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #eef5fc;
  }
  .si-head { display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 8px; }
  .si-head:hover .si-name { color: #3d83c6; }
  .search-item .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .search-item .txt { min-width: 0; }
  .search-item .txt .sub { display: block; color: #8ba3bd; font-size: 12px; margin-top: 2px; }
  .week-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px 2px 2px;
  }
  .week-chips::-webkit-scrollbar { height: 4px; }
  .week-chips::-webkit-scrollbar-thumb { background: #cfe2f5; border-radius: 4px; }
  .week-chips button {
    flex-shrink: 0;
    min-width: 32px;
    height: 26px;
    font-size: 12px;
    border: 1px solid #b9d8f2;
    background: #f0f7ff;
    color: #3d83c6;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .week-chips button:hover { background: #5aa9e6; border-color: #5aa9e6; color: #fff; }
  .week-chips button.nearest { background: #dceeff; border-color: #5aa9e6; font-weight: 700; }
  .search-empty { padding: 12px 14px; font-size: 13px; color: #8ba3bd; }

  .add-btn {
    border: none;
    background: linear-gradient(90deg, #4a9fe0, #6cb8f0);
    color: #fff;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(74, 159, 224, .35);
    transition: transform .15s;
    white-space: nowrap;
  }
  .add-btn:hover { transform: translateY(-1px); }
  .week-badge {
    background: linear-gradient(90deg, #d9ecff, #e8f5ff);
    color: #3d83c6;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid #c4e0f7;
  }

  .week-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .week-pills button {
    border: 1px solid #cfe2f5;
    background: #fff;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 13px;
    cursor: pointer;
    color: #6a87a5;
    transition: all .18s;
  }
  .week-pills button:hover { border-color: #5aa9e6; color: #5aa9e6; }
  .week-pills button.active {
    background: linear-gradient(90deg, #4a9fe0, #6cb8f0);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(74, 159, 224, .35);
  }
  .week-pills button.this-week::after { content: "·今"; color: #ff8a5c; font-weight: 700; }
  .week-pills button.active.this-week::after { color: #ffe066; }
  .week-pills button.exam { border-color: #f0bcc9; color: #c94f6d; }
  .week-pills button.exam.active { background: linear-gradient(90deg, #c94f6d, #a83855); color: #fff; }

  .exam-banner {
    background: linear-gradient(90deg, #fdeef1, #fde9f0);
    border: 1px solid #f0bcc9;
    color: #c2435f;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 1px;
  }
  .exam-banner span { display: block; font-weight: 400; font-size: 12px; margin-top: 4px; color: #d37a8e; }

  .table-card {
    background: rgba(255,255,255,.95);
    border: 1px solid #dbeaf8;
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(90, 169, 230, .14);
    overflow-x: auto;
  }
  table { width: 100%; min-width: 860px; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 1px solid #e8f1fa; text-align: center; vertical-align: middle; }
  thead th {
    background: linear-gradient(180deg, #eaf4ff, #e2efff);
    padding: 11px 4px;
    font-size: 14px;
    color: #4a7fb5;
  }
  thead th .date { display: block; font-size: 11px; color: #9cb8d4; margin-top: 2px; font-weight: 400; }
  thead th.today-col { background: linear-gradient(180deg, #cfe7ff, #e0f1ff); color: #2f7fc4; }
  tbody th {
    width: 92px;
    background: #f6fbff;
    font-size: 12px;
    color: #8ba3bd;
    padding: 10px 4px;
    font-weight: 500;
    line-height: 1.5;
  }
  td { height: 88px; padding: 4px; }

  .course {
    height: 100%;
    border-radius: 12px;
    padding: 7px 5px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    font-size: 12px;
    box-shadow: 0 3px 10px rgba(45, 74, 107, .15);
    transition: transform .15s;
    cursor: pointer;
  }
  .course:hover { transform: translateY(-2px) scale(1.02); }
  .course .name { font-weight: 700; font-size: 13px; }
  .course .meta { opacity: .93; line-height: 1.4; }
  .course.hit { outline: 2px dashed #8ec9f5; outline-offset: 2px; }
  .course.located { outline: 3px solid #ffb400; outline-offset: 1px; }
  .course.flash { animation: flashGlow .9s ease 4; }
  @keyframes flashGlow {
    0%, 100% { box-shadow: 0 3px 10px rgba(45,74,107,.15); }
    50% { box-shadow: 0 0 0 6px #ffd54d, 0 0 26px #ffb400; }
  }

  .empty-tip { text-align: center; color: #8ba3bd; font-size: 13px; padding: 16px; }

  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(45, 74, 107, .42);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border: 1px solid #dbeaf8;
    border-radius: 18px;
    padding: 24px;
    width: 440px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(45, 74, 107, .3);
  }
  .modal h3 {
    font-size: 18px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, #3d83c6, #6cb8f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 13px; color: #6a87a5; margin-bottom: 5px; }
  .form-row input[type="text"], .form-row select {
    width: 100%;
    border: 1px solid #cfe2f5;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    background: #f7fbff;
    color: #2d4a6b;
  }
  .form-row input:focus, .form-row select:focus { border-color: #5aa9e6; }
  .form-2col { display: flex; gap: 10px; }
  .form-2col .form-row { flex: 1; }
  .color-choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-choices input { display: none; }
  .color-choices .c {
    width: 26px; height: 26px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .15s;
  }
  .color-choices input:checked + .c { border-color: #2d4a6b; transform: scale(1.15); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    border: none;
  }
  .btn-primary { background: linear-gradient(90deg, #4a9fe0, #6cb8f0); color: #fff; font-weight: 700; }
  .btn-ghost { background: #eef5fc; color: #6a87a5; }
  .btn-danger { background: linear-gradient(90deg, #d45a76, #b03a52); color: #fff; font-weight: 700; }
  .detail-line { font-size: 14px; color: #4a6a8c; margin-bottom: 8px; line-height: 1.6; }
  .detail-line b { color: #2d4a6b; }

  /* 提醒设置面板 */
  .remind-master {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f0f7ff;
    border: 1px solid #cfe2f5;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 700;
    color: #3d83c6;
  }
  .remind-master label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .remind-master input { width: 18px; height: 18px; accent-color: #4a9fe0; cursor: pointer; }
  .btn-mini {
    border: 1px solid #b9d8f2;
    background: #fff;
    color: #3d83c6;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-mini:hover { background: #5aa9e6; border-color: #5aa9e6; color: #fff; }
  .time-choices { display: flex; gap: 14px; flex-wrap: wrap; }
  .time-choices label {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #4a6a8c; cursor: pointer;
    background: #f7fbff; border: 1px solid #dbeaf8;
    padding: 7px 12px; border-radius: 999px;
  }
  .time-choices input { accent-color: #4a9fe0; cursor: pointer; }
  .r-tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .r-list {
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid #e3eef9;
    border-radius: 12px;
  }
  .r-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    font-size: 13px;
    border-bottom: 1px solid #eef5fc;
    cursor: pointer;
  }
  .r-item:last-child { border-bottom: none; }
  .r-item:hover { background: #f0f7ff; }
  .r-item input { width: 16px; height: 16px; accent-color: #4a9fe0; cursor: pointer; flex-shrink: 0; }
  .r-item .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .r-item .sub { display: block; color: #8ba3bd; font-size: 12px; margin-top: 1px; }

  /* 活动提醒条 */
  .event-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,.92);
    border: 1px solid #dbeaf8;
    border-radius: 14px;
    padding: 12px 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 18px rgba(90, 169, 230, .12);
    cursor: pointer;
    transition: transform .15s;
  }
  .event-strip:hover { transform: translateY(-1px); border-color: #b9d8f2; }
  .event-strip .ev-emoji { font-size: 22px; }
  .event-strip .ev-info { flex: 1; min-width: 0; }
  .event-strip .ev-name { display: block; font-weight: 700; color: #3d83c6; font-size: 14px; }
  .event-strip .ev-sub { color: #8ba3bd; font-size: 12px; }
  .event-strip .ev-countdown {
    background: linear-gradient(90deg, #d9ecff, #e8f5ff);
    color: #3d83c6;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid #c4e0f7;
  }

  /* 活动提醒面板 */
  .form-row input[type="date"], .form-row input[type="time"] {
    width: 100%;
    border: 1px solid #cfe2f5;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    background: #f7fbff;
    color: #2d4a6b;
  }
  .ring-choices { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .ring-choices label {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: #4a6a8c; cursor: pointer;
    background: #f7fbff; border: 1px solid #dbeaf8;
    padding: 8px 14px; border-radius: 999px;
    transition: all .15s;
  }
  .ring-choices label:has(input:checked) {
    background: #dceeff; border-color: #5aa9e6; color: #2f7fc4; font-weight: 700;
  }
  .ring-choices input { accent-color: #4a9fe0; cursor: pointer; }
  .ring-custom {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: #f7fbff; border: 1px dashed #b9d8f2;
    border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  }
  .ring-custom input[type="file"] { font-size: 12px; color: #4a6a8c; max-width: 220px; }
  .ring-custom .file-name { font-size: 12px; color: #3d83c6; font-weight: 700; }
  .ev-main { flex: 1; min-width: 0; }
  .ev-item.past { opacity: .5; }
  .ev-del {
    border: 1px solid #f0bcc9;
    background: #fff;
    color: #c94f6d;
    font-size: 11px;
    padding: 4px 11px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .ev-del:hover { background: #c94f6d; color: #fff; }
  .ev-add-btn {
    width: 100%;
    border: none;
    background: linear-gradient(90deg, #4a9fe0, #6cb8f0);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .ev-add-btn:hover { transform: translateY(-1px); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(120px);
    background: linear-gradient(90deg, #4a90d9, #6cb8f0);
    color: #fff;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(74, 144, 217, .45);
    transition: transform .35s cubic-bezier(.2, .9, .3, 1.2);
    z-index: 200;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .banner { gap: 10px; }
    .banner-center { padding-bottom: 10px; order: -1; width: 100%; }
    .banner-center h1 { font-size: 24px; letter-spacing: 2px; }
    .chibi-float { width: 74px; height: 74px; right: 12px; bottom: 12px; }
    .cd-time { font-size: 26px; }
    td { height: 74px; }
    tbody th { width: 60px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="banner">
    <div class="banner-center">
      <h1>课 程 表</h1>
      <p>2026 秋季学期 · 共 20 周（第 19-20 周为考试周）· 数据来自学生课表.ics</p>
      <div class="deco">✦ ♪ ✦ ♪ ✦</div>
    </div>
  </header>

  <section class="countdown-card">
    <div>
      <div class="cd-title" id="cdTitle">距离下一节课还有</div>
      <div class="cd-time" id="cdTime">--:--:--</div>
      <div class="cd-course" id="cdCourse">正在计算…</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="remind-btn" id="remindBtn">提醒设置</button>
      <button class="remind-btn" id="eventBtn">活动提醒</button>
    </div>
  </section>

  <div class="event-strip" id="eventStrip" style="display:none;">
    <span class="ev-emoji">🎉</span>
    <div class="ev-info">
      <span class="ev-name" id="evStripName"></span>
      <span class="ev-sub" id="evStripSub"></span>
    </div>
    <span class="ev-countdown" id="evStripCd"></span>
  </div>

  <div class="toolbar">
    <label>开学日期 <input type="date" id="startDate"></label>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索课程 / 老师 / 地点…" autocomplete="off">
      <div class="search-results" id="searchResults">
        <div class="sel-panel" id="selPanel">
          <label>课程 <select id="selCourse"></select></label>
          <label>周次 <select id="selWeek"></select></label>
          <span class="sel-hint">选课→选周→自动跳转</span>
        </div>
        <div id="searchList"></div>
      </div>
    </div>

function getStartDate() {
  const d = new Date(startDateEl.value + "T00:00:00");

}
function calcCurrentWeek() {
  const today = new Date(); today.setHours(0,0,0,0);
  const w = Math.floor((today - getStartDate()) / MS_DAY / 7) + 1;
  return Math.min(Math.max(w, 1), TOTAL_WEEKS);
}
function courseActiveInWeek(c, w) { return c.weeks.includes(w); }
function activeWeeksOf(c) { return c.weeks.filter(w => w <= TOTAL_WEEKS); }
function firstActiveWeek(c) { return activeWeeksOf(c)[0] || c.weeks[0] || 1; }
function nearestActiveWeek(c, ref) {
  if (courseActiveInWeek(c, ref)) return ref;
  let best = null, bestD = Infinity;
  for (const w of activeWeeksOf(c)) {
    const d = Math.abs(w - ref);
    if (d < bestD || (d === bestD && w > best)) { best = w; bestD = d; }
  }
  return best || firstActiveWeek(c);
}
function weeksText(weeks) {
  const arr = weeks.slice().sort((a, b) => a - b);
  if (!arr.length) return "无";
  const ranges = [];
  let s = arr[0], p = arr[0];
  for (let i = 1; i <= arr.length; i++) {
    if (arr[i] === p + 1) { p = arr[i]; continue; }
    ranges.push(s === p ? "" + s : s + "-" + p);
    s = arr[i]; p = arr[i];
  }
  return ranges.join(",") + "周";
}
function periodTimeText(c) {
  if (c.timeNote) return c.timeNote;
  return PERIODS[c.period].time;
}
function pad(n) { return String(n).padStart(2, "0"); }
function fmtHMS(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return pad(Math.floor(s/3600)) + ":" + pad(Math.floor(s%3600/60)) + ":" + pad(s%60);
}
function fmtLong(ms) {
  const days = Math.floor(ms / MS_DAY);
  return (days > 0 ? days + " 天 " : "") + fmtHMS(ms % MS_DAY);
}
function setTimeOn(date, hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(date); d.setHours(h, m, 0, 0); return d;
}
function showToast(msg, ms = 5000) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), ms);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function matchCourse(c, q) {
  return c.name.toLowerCase().includes(q) || c.teacher.toLowerCase().includes(q) || c.room.toLowerCase().includes(q);
}
function eventDate(e) { return new Date(e.date + "T" + (e.time || "00:00") + ":00"); }
function fmtEventDate(d) {
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fmtEventGap(ms) {
  const min = Math.max(0, Math.floor(ms / 60000));
  if (min >= 1440) return Math.floor(min / 1440) + " 天 " + Math.floor(min % 1440 / 60) + " 小时";
  if (min >= 60) return Math.floor(min / 60) + " 小时 " + (min % 60) + " 分钟";
  return min + " 分钟";
}
function nextEvent() {
  const now = new Date();
  let best = null;
  for (const e of events) {
    const d = eventDate(e);
    if (d >= now && (!best || d < eventDate(best))) best = e;
  }
  return best;
}

// ================= 下一节课 & 声音提醒 =================
function computeNext() {
  const now = new Date();
  const start = getStartDate();
  let ongoing = null, next = null;
  for (let off = 0; off < 30; off++) {
    const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    const week = Math.floor((date - start) / MS_DAY / 7) + 1;
    if (week < 1) continue;
    if (week > TOTAL_WEEKS) break;
    const wd = date.getDay() === 0 ? 7 : date.getDay();
    for (const c of courses) {
      if (c.day !== wd || !courseActiveInWeek(c, week)) continue;
      const s = setTimeOn(date, c.startOverride || PERIODS[c.period].start);
      const e = setTimeOn(date, c.endOverride || PERIODS[c.period].end);
      if (now >= s && now < e) { if (!ongoing || e < ongoing.e) ongoing = { c, s, e, week }; }
      else if (now < s) { if (!next || s < next.s) next = { c, s, e, week }; }
    }
    if (next && off >= 1) break;
  }
  return { ongoing, next };
}

function playChime() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let round = 0; round < 2; round++) {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const t = t0 + round * 0.9 + i * 0.16;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.55);
    });
  }
}

function playBell() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [880, 660, 880, 990, 1320].forEach((f, i) => {
    const t = t0 + i * 0.35;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 1.15);
  });
}

function playScale() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5].forEach((f, i) => {
    const t = t0 + i * 0.11;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
  });
  [1046.5, 1318.5].forEach((f, i) => {
    const t = t0 + 0.95 + i * 0.18;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.65);
  });
}

function getRingtone() { return localStorage.getItem("animeScheduleRingtone") || "chime"; }
function playRingtone() {
  if (getRingtone() === "custom") {
    try {
      const src = localStorage.getItem("animeScheduleCustomRing");
      if (src) { new Audio(src).play().catch(() => {}); return; }
    } catch (e) {}
  }
  ensureAudio();
  const rt = getRingtone();
  if (rt === "bell") playBell();
  else if (rt === "up") playScale();
  else playChime();
}

function fireAlert(key, msg) {
  try {
    const map = JSON.parse(localStorage.getItem("animeScheduleAlerted") || "{}");
    const now = Date.now();
    for (const k in map) if (now - map[k] > 86400000) delete map[k];
    if (map[key]) return;
    map[key] = now;
    localStorage.setItem("animeScheduleAlerted", JSON.stringify(map));
  } catch (e) {
    if (alerted.has(key)) return;
    alerted.add(key);
  }
  playRingtone();
  showToast(msg, 8000);
}

function checkEventAlerts(now) {
  if (!eventRemindOn || !eventTimes.length) return;
  const thresholds = [...eventTimes].sort((a, b) => b - a);
  for (const e of events) {
    if (!e.remind) continue;
    const diff = eventDate(e) - now;
    if (diff <= 0 || diff > thresholds[0] * 60000) continue;
    thresholds.forEach((min, idx) => {
      const lower = idx + 1 < thresholds.length ? thresholds[idx + 1] : 0;
      if (diff <= min * 60000 && diff > lower * 60000) {
        const gapTxt = min >= 1440 ? Math.round(min / 1440) + " 天" : min + " 分钟";
        fireAlert("ev@" + e.id + "@" + e.date + "T" + e.time + "#" + min,
          "活动提醒：《" + e.name + "》还有 " + gapTxt + " 开始，地点 " + (e.loc || "待定") + " ♪");
      }
    });
  }
}

      localStorage.setItem("animeScheduleRingtone", "custom");
      syncRingUI();
      showToast("自定义铃声已保存 ♪", 2500);
    } catch (err) {
      showToast("保存失败，音频过大", 3000);
    }
  };
  fr.readAsDataURL(f);
});

$("ringClear").onclick = () => {
  localStorage.removeItem("animeScheduleCustomRing");
  localStorage.setItem("animeScheduleRingtone", "chime");
  syncRingUI();
  showToast("已恢复默认铃声", 2000);
};

document.querySelectorAll(".evTime").forEach(cb => {
  cb.addEventListener("change", () => {
    eventTimes = [...document.querySelectorAll(".evTime:checked")].map(c => +c.value);
    saveEventCfg();
  });
});

evListEl.addEventListener("change", e => {
  const id = e.target.dataset.evid;
  if (!id) return;
  const ev = events.find(x => x.id === id);
  if (ev) { ev.remind = e.target.checked; saveEvents(); updateEventStrip(); }
});

evListEl.addEventListener("click", e => {
  const id = e.target.dataset.del;
  if (!id) return;
  events = events.filter(x => x.id !== id);
  saveEvents();
  renderEventList();
  updateEventStrip();
});

$("evAddBtn").onclick = () => {
  const name = $("evInputName").value.trim();
  const date = $("evInputDate").value;
  const time = $("evInputTime").value || "19:00";
  const loc = $("evInputLoc").value.trim();
  if (!name) { showToast("请填写活动名称", 2500); return; }
  if (!date) { showToast("请选择活动日期", 2500); return; }
  events.push({ id: "ev" + Date.now(), name, date, time, loc, color: "#5aa9e6", remind: true });
  saveEvents();
  $("evInputName").value = "";
  $("evInputLoc").value = "";
  renderEventList();
  updateEventStrip();
  showToast("已添加活动：" + name, 2500);
};

function tick() {
  const now = new Date();
  const { ongoing, next } = computeNext();
  if (ongoing) {
    cdTitle.textContent = "正在上课中 ♪";
    cdTime.textContent = "距离下课 " + fmtHMS(ongoing.e - now);
    cdCourse.textContent = "《" + ongoing.c.name + "》 " + ongoing.c.teacher + " · " + ongoing.c.room;
  } else if (next) {
    const diff = next.s - now;
    cdTitle.textContent = "距离下一节课还有";
    cdTime.textContent = fmtLong(diff);
    cdCourse.textContent = "《" + next.c.name + "》 " + next.c.teacher + " · " + next.c.room +
      " · " + WEEKDAY_NAMES[next.c.day-1] + " " + PERIODS[next.c.period].label + "（第 " + next.week + " 周）";
    if (remindersOn && !remindDisabled.includes(next.c.id)) {
      const keyBase = next.c.id + "@" + next.s.getTime();
      const thresholds = [...remindTimes].sort((a, b) => b - a);
      thresholds.forEach((min, idx) => {
        const lower = idx + 1 < thresholds.length ? thresholds[idx + 1] : 0;
        if (diff <= min * 60000 && diff > lower * 60000)
          fireAlert(keyBase + "#" + min, "提醒：《" + next.c.name + "》还有 " + min + " 分钟上课，地点 " + next.c.room + " ♪");
      });
    }
  } else {
    cdTitle.textContent = "本学期课程已全部结束";
    cdTime.textContent = "--:--:--";
    cdCourse.textContent = "考试周的安排请以学校实际通知为准";
  }
  checkEventAlerts(now);
  updateEventStrip();
}

// ================= 开学日期 =================
startDateEl.addEventListener("change", () => {
  localStorage.setItem("animeScheduleStart", startDateEl.value);
  selectWeek(calcCurrentWeek());
});

// ================= 初始化 =================
(function init() {
  selectWeek(calcCurrentWeek());
  updateRemindBtn();
  updateEventStrip();
  tick();
  setInterval(tick, 1000);
})();
</script>
